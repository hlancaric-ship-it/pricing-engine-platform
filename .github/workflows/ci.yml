name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
    - run: npm ci
    - run: npm run build
    - run: npm test
    - run: npx eslint src tests
    - name: Run E2E Benchmark
      # products.csv is gitignored (local/real data goes here in normal dev
      # use) -- CI has no such file, so seed it from the committed synthetic
      # fixture (no real client/product data) before generating mock rows.
      run: |
        cp fixtures/products.sample.csv products.csv
        npm run mock:data -- 100000
        npm run benchmark -- 100000
