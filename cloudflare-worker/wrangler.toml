name = "pricing-engine-platform-worker"
main = "src/index.ts"
compatibility_date = "2024-07-20"

kv_namespaces = [
  { binding = "VIP_KV", id = "REPLACE_WITH_YOUR_OWN_KV_NAMESPACE_ID" }
]

r2_buckets = [
  { binding = "FEED_BUCKET", bucket_name = "pricing-engine-platform-feed-bucket" }
]

[vars]
# Deliberately NOT okfish.sk's live feed URL/hash — this is a placeholder-value
# config file for this platform-independent repo, not a live deployment target.
# Set your own feed URL (or a test fixture) before ever running `wrangler deploy`.
MASTER_FEED_URL = "https://example.com/replace-with-your-own-feed-url.csv"

# SECRET_TOKEN (admin/write-endpoint auth) is NOT set here -- secrets never go in
# wrangler.toml/[vars] in plaintext, and each client deployment MUST get its own
# unique value (never reuse the same token across clients). Set it with:
#   npx wrangler secret put SECRET_TOKEN
# Do this BEFORE the first deploy for every new client -- the Worker will throw on
# any admin/write request (checkAuth) until it's set.

[triggers]
crons = ["12 6,10,14,18,22 * * *"]

[env.staging]
name = "pricing-engine-platform-worker-staging"
[env.staging.triggers]
crons = []

[env.staging.vars]
MASTER_FEED_URL = "https://example.com/replace-with-your-own-feed-url.csv"

[[env.staging.kv_namespaces]]
binding = "VIP_KV"
id = "REPLACE_WITH_YOUR_OWN_STAGING_KV_NAMESPACE_ID"

[[env.staging.r2_buckets]]
binding = "FEED_BUCKET"
bucket_name = "pricing-engine-platform-feed-bucket-staging"
